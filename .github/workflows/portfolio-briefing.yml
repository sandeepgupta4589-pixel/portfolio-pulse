name: Portfolio Pulse Daily Briefing

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 22 * * 1-5'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate portfolio briefing dashboard
        run: python -m src.main
        env:
          TRADIER_SANDBOX_TOKEN: ${{ secrets.TRADIER_SANDBOX_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}

      - name: Commit and push generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f docs/index.html ]; then
            git add docs/index.html
            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Auto: update portfolio briefing"
              git push
            fi
          else
            echo "docs/index.html not found; skipping commit"
          fi
